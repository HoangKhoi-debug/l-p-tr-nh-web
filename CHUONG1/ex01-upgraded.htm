<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Du lịch Bạc Liêu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            padding: 40px;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #334155 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 50px, rgba(100, 149, 237, 0.03) 50px, rgba(100, 149, 237, 0.03) 51px),
                repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(100, 149, 237, 0.03) 50px, rgba(100, 149, 237, 0.03) 51px);
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            from { transform: translate(0, 0); }
            to { transform: translate(50px, 50px); }
        }

        .container {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(51, 65, 85, 0.9) 100%);
            padding: 60px;
            border-radius: 15px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5), 0 0 100px rgba(100, 149, 237, 0.2);
            max-width: 900px;
            text-align: center;
            border: 2px solid rgba(100, 149, 237, 0.3);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, transparent, rgba(100, 149, 237, 0.2), transparent);
            border-radius: 15px;
            z-index: -1;
            animation: borderGlow 3s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        h1 {
            font-family: 'Times New Roman', Times, serif;
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(135deg, #CBD5E1, #6495ED, #CBD5E1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 40px;
            letter-spacing: 0.3rem;
            text-shadow: 0 0 30px rgba(100, 149, 237, 0.5);
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #6495ED, transparent);
            box-shadow: 0 0 10px #6495ED;
        }

        .image-container {
            margin: 50px 0;
            position: relative;
        }

        .image-placeholder {
            width: 100%;
            max-width: 600px;
            height: 350px;
            background: linear-gradient(135deg, #1E293B 0%, #334155 50%, #475569 100%);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #CBD5E1;
            font-size: 1.5rem;
            font-family: 'Times New Roman', Times, serif;
            border-radius: 10px;
            border: 2px solid rgba(100, 149, 237, 0.4);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), inset 0 0 50px rgba(100, 149, 237, 0.1);
            position: relative;
            overflow: hidden;
        }

        .image-placeholder::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(100, 149, 237, 0.1) 0%, transparent 70%);
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .greeting {
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.8rem;
            font-weight: bold;
            font-style: italic;
            margin-top: 40px;
            color: #CBD5E1;
            text-shadow: 0 0 20px rgba(100, 149, 237, 0.5);
            letter-spacing: 0.1rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 2rem;
                letter-spacing: 0.15rem;
            }

            .image-placeholder {
                height: 250px;
                font-size: 1.2rem;
            }

            .greeting {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DU LỊCH BẠC LIÊU</h1>
        
        <div class="image-container">
            <div class="image-placeholder">
                Hình ảnh Du lịch Bạc Liêu
            </div>
        </div>
        
        <p class="greeting">Kính chào quý khách!</p>
    </div>
</body>
</html>
