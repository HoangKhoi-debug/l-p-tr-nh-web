<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký xét tuyển</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            padding: 40px;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #334155 100%);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 50px, rgba(100, 149, 237, 0.03) 50px, rgba(100, 149, 237, 0.03) 51px),
                repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(100, 149, 237, 0.03) 50px, rgba(100, 149, 237, 0.03) 51px);
            z-index: 0;
        }

        .form-container {
            width: 750px;
            max-width: 90%;
            margin: 30px auto;
            border: 3px solid rgba(100, 149, 237, 0.5);
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(51, 65, 85, 0.9) 100%);
            padding: 50px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5), 0 0 100px rgba(100, 149, 237, 0.3);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            border-radius: 10px;
        }

        .form-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at top right, rgba(100, 149, 237, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .header-form {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
            z-index: 2;
        }

        .header-form h3 {
            margin: 8px 0;
            font-size: 1.3rem;
            color: #CBD5E1;
            font-family: 'Times New Roman', Times, serif;
            letter-spacing: 0.1rem;
        }

        .header-form h2 {
            margin: 30px 0;
            font-size: 2rem;
            color: #CBD5E1;
            font-weight: bold;
            font-family: 'Times New Roman', Times, serif;
            background: linear-gradient(135deg, #CBD5E1, #6495ED);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.2rem;
        }

        .form-group {
            margin: 30px 0;
            display: flex;
            align-items: flex-start;
            position: relative;
            z-index: 2;
        }

        .form-group label {
            min-width: 160px;
            font-size: 1.2rem;
            font-weight: bold;
            padding-top: 12px;
            font-family: 'Times New Roman', Times, serif;
            color: #CBD5E1;
        }

        .form-group input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            font-size: 1.1rem;
            border: 2px solid rgba(100, 149, 237, 0.5);
            background: rgba(15, 23, 42, 0.6);
            color: #CBD5E1;
            font-family: 'Times New Roman', Times, serif;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .form-group input[type="text"]:focus {
            outline: none;
            border-color: #6495ED;
            box-shadow: 0 0 20px rgba(100, 149, 237, 0.4);
            background: rgba(15, 23, 42, 0.8);
        }

        .form-group input[type="text"]::placeholder {
            color: #64748B;
        }

        .radio-group {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .radio-group input[type="radio"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            accent-color: #6495ED;
            cursor: pointer;
        }

        .radio-group label {
            min-width: auto;
            font-size: 1.1rem;
            font-weight: normal;
            font-family: 'Times New Roman', Times, serif;
            color: #CBD5E1;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .radio-group label:hover {
            color: #6495ED;
        }

        .major-section {
            margin-left: 160px;
        }

        .major-option {
            display: flex;
            align-items: center;
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .major-option:hover {
            background: rgba(100, 149, 237, 0.1);
            padding-left: 20px;
        }

        .major-option input[type="radio"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            accent-color: #6495ED;
            cursor: pointer;
        }

        .major-option label {
            font-size: 1.1rem;
            font-family: 'Times New Roman', Times, serif;
            color: #CBD5E1;
            cursor: pointer;
        }

        .button-group {
            text-align: center;
            margin-top: 50px;
            position: relative;
            z-index: 2;
        }

        .button-group button {
            padding: 15px 45px;
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0 20px;
            cursor: pointer;
            border: 2px solid rgba(100, 149, 237, 0.5);
            background: linear-gradient(135deg, #1E293B, #334155);
            color: #CBD5E1;
            border-radius: 8px;
            font-family: 'Times New Roman', Times, serif;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .button-group button:hover {
            background: linear-gradient(135deg, #334155, #475569);
            border-color: #6495ED;
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(100, 149, 237, 0.4);
        }

        .button-group button:active {
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 30px 20px;
            }

            .form-group {
                flex-direction: column;
                gap: 10px;
            }

            .form-group label {
                min-width: auto;
            }

            .major-section {
                margin-left: 0;
            }

            .button-group button {
                margin: 10px;
                padding: 12px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="header-form">
            <h3>TRƯỜNG ĐẠI HỌC BẠC LIÊU</h3>
            <h3>KHOA KỸ THUẬT VÀ CÔNG NGHỆ</h3>
            <h2>ĐĂNG KÝ XÉT TUYỂN</h2>
        </div>
        
        <div class="form-group">
            <label>Họ tên:</label>
            <input type="text" name="hoten" placeholder="Nhập họ tên">
        </div>
        
        <div class="form-group">
            <label>Giới tính:</label>
            <div class="radio-group">
                <div>
                    <input type="radio" name="gioitinh" value="nam" id="nam" checked>
                    <label for="nam">Nam</label>
                </div>
                <div>
                    <input type="radio" name="gioitinh" value="nu" id="nu">
                    <label for="nu">Nữ</label>
                </div>
            </div>
        </div>
        
        <div class="form-group" style="display: block;">
            <label>Ngành thi:</label>
            <div class="major-section">
                <div class="major-option">
                    <input type="radio" name="nganh" value="cntt" id="cntt" checked>
                    <label for="cntt">Công nghệ thông tin</label>
                </div>
                <div class="major-option">
                    <input type="radio" name="nganh" value="mammon" id="mammon">
                    <label for="mammon">Mầm non</label>
                </div>
                <div class="major-option">
                    <input type="radio" name="nganh" value="amnhac" id="amnhac">
                    <label for="amnhac">Âm nhạc</label>
                </div>
            </div>
        </div>
        
        <div class="button-group">
            <button type="submit">Đồng ý</button>
            <button type="reset">Không đồng ý</button>
        </div>
    </div>
</body>
</html>
